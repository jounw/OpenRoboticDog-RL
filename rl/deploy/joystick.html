<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RoboDog Joystick</title>
<style>
 html,body{margin:0;height:100%;background:#111;color:#eee;font-family:-apple-system,sans-serif;touch-action:none;overflow:hidden}
 #top{display:flex;gap:8px;padding:8px;align-items:center;font-size:14px}
 button{font-size:16px;padding:10px 14px;border:0;border-radius:8px;color:#fff}
 #start{background:#2a7}#stop{background:#c33}
 #pads{display:flex;height:calc(100% - 60px)}
 .pad{flex:1;position:relative;margin:8px;border-radius:16px;background:#1c1c1c}
 .knob{position:absolute;width:90px;height:90px;border-radius:50%;background:#48f;opacity:.85;transform:translate(-50%,-50%);left:50%;top:50%}
 .label{position:absolute;top:8px;left:12px;color:#888;font-size:13px}
 #st{margin-left:auto;color:#9c9}
</style></head><body>
<div id="top">
 <button id="start">START</button><button id="stop">E-STOP</button>
 <span id="st">connecting…</span>
</div>
<div id="pads">
 <div class="pad" id="L"><span class="label">move (vx / vy)</span><div class="knob" id="Lk"></div></div>
 <div class="pad" id="R"><span class="label">turn (yaw)</span><div class="knob" id="Rk"></div></div>
</div>
<script>
const S={vx:0,vy:0,yaw:0,deadman:false}; let enabled=false, pending={};
function bind(pad,knob,onMove){
  let id=null,cx=0,cy=0;
  const R=90;
  pad.addEventListener('pointerdown',e=>{id=e.pointerId;const r=pad.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;pad.setPointerCapture(id);mv(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
  const up=e=>{if(e.pointerId===id){id=null;knob.style.left='50%';knob.style.top='50%';onMove(0,0,false);}};
  pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  function mv(e){let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}
    knob.style.left=`calc(50% + ${dx}px)`;knob.style.top=`calc(50% + ${dy}px)`;onMove(dx/R,dy/R,true);}
}
let Lon=false,Ron=false;
bind(document.getElementById('L'),document.getElementById('Lk'),(x,y,on)=>{S.vx=-y;S.vy=-x;Lon=on;S.deadman=Lon||Ron;});
bind(document.getElementById('R'),document.getElementById('Rk'),(x,y,on)=>{S.yaw=-x;Ron=on;S.deadman=Lon||Ron;});
document.getElementById('start').onclick=()=>{enabled=!enabled;pending.enable=enabled;document.getElementById('start').textContent=enabled?'PAUSE':'START';};
document.getElementById('stop').onclick=()=>{pending.estop=true;pending.enable=false;enabled=false;document.getElementById('start').textContent='START';};
async function tick(){
  try{const msg=Object.assign({},S,pending);pending={};const r=await fetch('/cmd',{method:'POST',body:JSON.stringify(msg)});const j=await r.json();
    if(j.enable!==enabled){enabled=j.enable;document.getElementById('start').textContent=enabled?'PAUSE':'START';}
    document.getElementById('st').textContent=`${j.halt?'STOPPED: '+j.halt+' | ':''}${j.enable?'RUN':'HOLD'} ${j.estop?'ESTOP ':''}${j.voltage??'-'}V tilt ${j.tilt_deg??'-'}° ${j.loop_hz??'-'}Hz`;
  }catch(e){document.getElementById('st').textContent='disconnected';}
  setTimeout(tick,50);
}
tick();
</script></body></html>
